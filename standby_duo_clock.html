<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StandBy Duo Clock</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 전체 컨테이너 (화면 중앙 정렬) */
        .standby-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            padding: 40px;
            position: relative;
        }

        /* 상단 조작 버튼 영역 */
        .controls {
            position: absolute;
            top: 20px;
            left: 50px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }
        .btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.3);
        }

        /* 모드 1: 아날로그 + 달력 듀오 스타일 */
        .duo-panel {
            display: flex;
            width: 100%;
            height: 100%;
            justify-content: space-around;
            align-items: center;
        }

        .analog-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 아날로그 시계 판 */
        .clock-face {
            width: 280px;
            height: 280px;
            border: 4px solid #333;
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle, #111 0%, #000 100%);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 4px;
        }
        .hour-hand { width: 6px; height: 75px; background: #fff; margin-left: -3px; }
        .minute-hand { width: 4px; height: 105px; background: #fff; margin-left: -2px; }
        .second-hand { width: 2px; height: 120px; background: #ff9f0a; margin-left: -1px; }
        .center-dot {
            width: 12px; height: 12px; background: #ff9f0a; border-radius: 50%;
            position: absolute; top: 50%; left: 50%; transform: translate(-6px, -6px);
        }
        .clock-num {
            position: absolute; width: 100%; height: 100%; text-align: center;
            font-size: 20px; font-weight: bold; color: #888; padding: 10px;
        }

        /* 오른쪽 달력 박스 */
        .calendar-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 30px;
            width: 340px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .cal-header {
            font-size: 28px;
            font-weight: bold;
            color: #ff453a;
            margin-bottom: 5px;
        }
        .cal-sub {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 20px;
        }
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            font-size: 14px;
        }
        .cal-day-name { color: #666; font-weight: bold; padding-bottom: 8px; }
        .cal-date { padding: 8px 0; color: #ddd; }
        .cal-date.today {
            background: #ff453a;
            color: #fff;
            border-radius: 50%;
            font-weight: bold;
        }
        .cal-date.sun { color: #ff453a; }

        /* 모드 2: 대형 플립 시계 스타일 */
        .flip-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .flip-time-container {
            font-size: 90px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            font-family: monospace;
        }
        .flip-date-text {
            font-size: 24px;
            color: #ff9f0a;
            margin-top: 20px;
        }

        /* 야간 모드 (레드 테마) */
        body.night-mode {
            background-color: #000000 !important;
        }
        body.night-mode .calendar-box {
            background: rgba(50, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.2);
        }
        body.night-mode .clock-face {
            border-color: #400;
            background: radial-gradient(circle, #200 0%, #000 100%);
        }
        body.night-mode .hand.second-hand,
        body.night-mode .center-dot,
        body.night-mode .cal-header,
        body.night-mode .flip-date-text {
            color: #ff3b30 !important;
            background-color: #ff3b30;
        }
        body.night-mode .cal-date.today {
            background: #ff3b30 !important;
        }
        body.night-mode * {
            color: #ff6961 !important;
        }
        body.night-mode .cal-date.today {
            color: #000 !important;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button class="btn" onclick="switchMode('duo')">아날로그+달력</button>
        <button class="btn" onclick="switchMode('flip')">플립 시계</button>
        <button class="btn" onclick="toggleNightMode()">야간 모드</button>
    </div>

    <div class="standby-container">
        <!-- 1. 아날로그 + 달력 듀오 모드 -->
        <div id="duoPanel" class="duo-panel">
            <div class="analog-box">
                <div class="clock-face" id="clockFace">
                    <!-- 시계 숫자 배치 -->
                    <div class="clock-num" style="transform: rotate(30deg);"><span style="display:inline-block; transform: rotate(-30deg);">1</span></div>
                    <div class="clock-num" style="transform: rotate(60deg);"><span style="display:inline-block; transform: rotate(-60deg);">2</span></div>
                    <div class="clock-num" style="transform: rotate(90deg);"><span style="display:inline-block; transform: rotate(-90deg);">3</span></div>
                    <div class="clock-num" style="transform: rotate(120deg);"><span style="display:inline-block; transform: rotate(-120deg);">4</span></div>
                    <div class="clock-num" style="transform: rotate(150deg);"><span style="display:inline-block; transform: rotate(-150deg);">5</span></div>
                    <div class="clock-num" style="transform: rotate(180deg);"><span style="display:inline-block; transform: rotate(-180deg);">6</span></div>
                    <div class="clock-num" style="transform: rotate(210deg);"><span style="display:inline-block; transform: rotate(-210deg);">7</span></div>
                    <div class="clock-num" style="transform: rotate(240deg);"><span style="display:inline-block; transform: rotate(-240deg);">8</span></div>
                    <div class="clock-num" style="transform: rotate(270deg);"><span style="display:inline-block; transform: rotate(-270deg);">9</span></div>
                    <div class="clock-num" style="transform: rotate(300deg);"><span style="display:inline-block; transform: rotate(-300deg);">10</span></div>
                    <div class="clock-num" style="transform: rotate(330deg);"><span style="display:inline-block; transform: rotate(-330deg);">11</span></div>
                    <div class="clock-num" style="transform: rotate(360deg);"><span style="display:inline-block; transform: rotate(-360deg);">12</span></div>
                    
                    <div class="hand hour-hand" id="hourHand"></div>
                    <div class="hand minute-hand" id="minuteHand"></div>
                    <div class="hand second-hand" id="secondHand"></div>
                    <div class="center-dot"></div>
                </div>
            </div>

            <div class="calendar-box">
                <div class="cal-header" id="calMonth">10월</div>
                <div class="cal-sub" id="calYearSub">2026년</div>
                <div class="cal-grid" id="calGrid">
                    <!-- 요일 헤더 -->
                    <div class="cal-day-name sun">일</div>
                    <div class="cal-day-name">월</div>
                    <div class="cal-day-name">화</div>
                    <div class="cal-day-name">수</div>
                    <div class="cal-day-name">목</div>
                    <div class="cal-day-name">금</div>
                    <div class="cal-day-name">토</div>
                    <!-- 날짜 그리드는 자바스크립트로 동적 생성 -->
                </div>
            </div>
        </div>

        <!-- 2. 플립 시계 모드 -->
        <div id="flipPanel" class="flip-panel">
            <div class="flip-time-container" id="flipTimeText">00:00:00</div>
            <div class="flip-date-text" id="flipDateText">2026년 10월 28일 수요일</div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // 아날로그 시계 바늘 회전 각도 계산
            const hourDeg = (hours % 12) * 30 + minutes * 0.5;
            const minDeg = minutes * 6.5;
            const secDeg = seconds * 6;

            document.getElementById('hourHand').style.transform = `rotate(${hourDeg}deg)`;
            document.getElementById('minuteHand').style.transform = `rotate(${minDeg}deg)`;
            document.getElementById('secondHand').style.transform = `rotate(${secDeg}deg)`;

            // 플립 시계 텍스트 업데이트
            const hStr = String(hours).padStart(2, '0');
            const mStr = String(minutes).padStart(2, '0');
            const sStr = String(seconds).padStart(2, '0');
            document.getElementById('flipTimeText').innerText = `${hStr}:${mStr}:${sStr}`;

            // 날짜 텍스트 업데이트
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dayStr = days[now.getDay()];

            document.getElementById('calMonth').innerText = `${month}월`;
            document.getElementById('calYearSub').innerText = `${year}년`;
            document.getElementById('flipDateText').innerText = `${year}년 ${month}월 ${date}일 ${dayStr요일 = dayStr}요일`;
        }

        // 달력 자동 생성 함수
        function generateCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const todayDate = now.getDate();

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            let gridHtml = `
                <div class="cal-day-name sun">일</div>
                <div class="cal-day-name">월</div>
                <div class="cal-day-name">화</div>
                <div class="cal-day-name">수</div>
                <div class="cal-day-name">목</div>
                <div class="cal-day-name">금</div>
                <div class="cal-day-name">토</div>
            `;

            for (let i = 0; i < firstDayIndex; i++) {
                gridHtml += `<div></div>`;
            }

            for (let d = 1; d <= totalDays; d++) {
                let isToday = (d === todayDate) ? 'today' : '';
                let isSun = (new Date(year, month, d).getDay() === 0) ? 'sun' : '';
                gridHtml += `<div class="cal-date ${isToday} ${isSun}">${d}</div>`;
            }

            document.getElementById('calGrid').innerHTML = gridHtml;
        }

        // 모드 전환 함수
        function switchMode(mode) {
            if (mode === 'duo') {
                document.getElementById('duoPanel').style.display = 'flex';
                document.getElementById('flipPanel').style.display = 'none';
            } else {
                document.getElementById('duoPanel').style.display = 'none';
                document.getElementById('flipPanel').style.display = 'flex';
            }
        }

        // 야간 모드 토글
        function toggleNightMode() {
            document.body.classList.toggle('night-mode');
        }

        setInterval(updateClock, 1000);
        updateClock();
        generateCalendar();
    </script>
</body>
</html>
